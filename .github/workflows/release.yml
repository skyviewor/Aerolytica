name: Publish Aerolytica to OSS
on:
  push:
    branches: [testing]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Release environment (testing does not update production)'
        type: choice
        options: [testing, production]
        default: testing
        required: true
      tag:
        description: 'Existing tag matching v<pyproject version>'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: aerolytica-${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}-release
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-22.04
    environment: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
    outputs:
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
      source_sha: ${{ steps.release_identity.outputs.source_sha }}
      artifact_prefix: ${{ steps.release_identity.outputs.artifact_prefix }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_NOTES: ${{ github.event.release.body }}
      RELEASE_ENVIRONMENT: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra dev
      - name: Validate release identity
        id: release_identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/testing
            test "$RELEASE_ENVIRONMENT" = testing
            RELEASE_TAG="$(python -c 'import pathlib,tomllib; print("v" + tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          fi
          uv run --locked python scripts/release/validate_artifacts.py --tag "$RELEASE_TAG"
          if [ "$RELEASE_ENVIRONMENT" = production ]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          artifact_prefix="releases/${RELEASE_TAG#v}"
          if [ "$RELEASE_ENVIRONMENT" = testing ]; then
            printf 'testing_revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            artifact_prefix="$artifact_prefix/revisions/$(git rev-parse HEAD)"
          fi
          printf 'artifact_prefix=%s\n' "$artifact_prefix" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: uv run --locked ruff check src tests scripts/release
      - name: Warm build dependencies for offline release tests
        run: uv build --out-dir "$RUNNER_TEMP/aero-build-check"
      - run: uv run --locked pytest
      - working-directory: webui
        run: npm ci && npm run check && npm run build
      - name: Build signed release once
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEYS: ${{ secrets.RELEASE_PUBLIC_KEYS || vars.RELEASE_PUBLIC_KEYS || '{}' }}
          AERO_RELEASE_REQUIRE_CONFIG: '1'
          AERO_ENVIRONMENT: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
          AERO_OFFICIAL_API_URL: ${{ secrets.AERO_OFFICIAL_API_URL || vars.AERO_OFFICIAL_API_URL }}
          AERO_OFFICIAL_LLM_URL: ${{ secrets.AERO_OFFICIAL_LLM_URL || vars.AERO_OFFICIAL_LLM_URL }}
          AERO_DOWNLOAD_BASE: ${{ secrets.AERO_DOWNLOAD_BASE || vars.AERO_DOWNLOAD_BASE }}
          AERO_RELEASE_REVISION: ${{ steps.release_identity.outputs.testing_revision }}
        run: uv run --locked python scripts/release/prepare.py --tag "$RELEASE_TAG"
      - run: uv run --locked python scripts/release/validate_artifacts.py dist/release/pypi
      - name: Install the exact locked release
        env:
          RELEASE_ARTIFACT_PREFIX: ${{ steps.release_identity.outputs.artifact_prefix }}
        run: |
          uv venv --python 3.12 dist/smoke
          uv pip sync --python dist/smoke/bin/python --require-hashes --only-binary :all: "dist/release/download/$RELEASE_ARTIFACT_PREFIX/requirements.txt"
          uv pip install --python dist/smoke/bin/python --no-deps dist/release/pypi/*.whl
          dist/smoke/bin/python -c 'from aero.distribution import smoke; from aero.version import get_version; from pathlib import Path; import sys; smoke(Path(sys.prefix), get_version())'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aerolytica-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 90
  stage-oss:
    needs: build
    runs-on: ubuntu-22.04
    environment: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
    env:
      AERO_ENVIRONMENT: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
      AERO_DOWNLOAD_BASE: ${{ secrets.AERO_DOWNLOAD_BASE || vars.AERO_DOWNLOAD_BASE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aerolytica-release
          path: dist/release
      - run: python -m pip install oss2==2.19.1 packaging==25.0
      - name: Stage immutable OSS files
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET || vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT || vars.OSS_ENDPOINT }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX || vars.OSS_PREFIX }}
        run: python scripts/release/publish_oss.py stage
      - name: Verify public URLs before publishing
        run: python scripts/release/verify_public.py dist/release/download
  install-smoke:
    needs: [build, stage-oss]
    environment: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      AERO_ENVIRONMENT: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
      AERO_DOWNLOAD_BASE: ${{ secrets.AERO_DOWNLOAD_BASE || vars.AERO_DOWNLOAD_BASE }}
      RELEASE_ARTIFACT_PREFIX: ${{ needs.build.outputs.artifact_prefix }}
    steps:
      - name: Install the staged release using only the shell bootstrap
        shell: bash
        run: |
          export AERO_HOME="$RUNNER_TEMP/aero-home"
          export AERO_INSTALL_ROOT="$AERO_HOME/client"
          export AERO_BIN_DIR="$RUNNER_TEMP/aero-bin"
          export AERO_RELEASE_MANIFEST="$RELEASE_ARTIFACT_PREFIX/release.json"
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 --proto '=https' --proto-redir '=https' "$AERO_DOWNLOAD_BASE/$RELEASE_ARTIFACT_PREFIX/install.sh" -o "$RUNNER_TEMP/aero-install.sh"
          sh "$RUNNER_TEMP/aero-install.sh"
          AERO_COMMAND=aero
          if [ "$AERO_ENVIRONMENT" = testing ]; then AERO_COMMAND=aero-testing; fi
          "$AERO_BIN_DIR/$AERO_COMMAND" version
          "$AERO_BIN_DIR/$AERO_COMMAND" setup --runtime-only --yes
          "$AERO_BIN_DIR/$AERO_COMMAND" doctor
          "$AERO_INSTALL_ROOT/current/bin/python" -c 'from aero.core.official_account import platform_api_url, relay_llm_url; from aero.release_environment import distribution_profile; p=distribution_profile(); assert platform_api_url() == p["api_url"]; assert relay_llm_url() == p["llm_url"]'
          "$AERO_INSTALL_ROOT/current/bin/python" -c 'from aero.distribution import managed_install, smoke; from aero.version import get_version; from pathlib import Path; import sys; assert managed_install(); smoke(Path(sys.prefix), get_version())'
  promote-oss:
    needs: [build, install-smoke]
    runs-on: ubuntu-22.04
    environment: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
    env:
      AERO_ENVIRONMENT: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'testing' }}
      AERO_DOWNLOAD_BASE: ${{ secrets.AERO_DOWNLOAD_BASE || vars.AERO_DOWNLOAD_BASE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aerolytica-release
          path: dist/release
      - run: python -m pip install oss2==2.19.1 packaging==25.0
      - name: Promote stable entry only after all platform smoke tests succeed
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET || vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT || vars.OSS_ENDPOINT }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX || vars.OSS_PREFIX }}
        run: python scripts/release/publish_oss.py promote
