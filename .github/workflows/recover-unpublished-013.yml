name: Recover unpublished 0.1.3 staging
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Only the cancelled, unpublished production 0.1.3 upload'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: aerolytica-production-release
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install oss2==2.19.1
      - name: Remove only the explicitly approved unpublished files
        env:
          RECOVERY_CONFIRM: ${{ inputs.confirmation }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET || vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT || vars.OSS_ENDPOINT }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX || vars.OSS_PREFIX }}
        run: python scripts/release/cleanup_unpublished_013.py
