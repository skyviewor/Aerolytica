name: TestPyPI rehearsal
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching v<pyproject version>'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aerolytica-testpypi
  cancel-in-progress: false
jobs:
  rehearsal:
    # Paused while organization approval is pending; requires explicit opt-in.
    if: ${{ vars.ENABLE_TESTPYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-22.04
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra dev
      - run: uv run --locked python scripts/release/validate_artifacts.py --tag "$RELEASE_TAG"
      - run: uv run --locked ruff check src tests scripts/release
      - run: uv run --locked pytest
      - working-directory: webui
        run: npm ci && npm run check && npm run build
      - run: uv build --out-dir dist/pypi
      - run: uv run --locked python scripts/release/validate_artifacts.py dist/pypi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/pypi
