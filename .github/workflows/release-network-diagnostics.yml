name: Release network diagnostics
on:
  push:
    branches: [testing]
    paths: [.github/workflows/release-network-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Inspect public release connectivity without credentials
        shell: bash
        run: |
          curl --version
          getent ahosts aerolytica.skyviewor.team || true
          for url in https://aerolytica.skyviewor.team/download/stable.json https://aero.skyviewor.com/download/stable.json; do
            for family in --ipv4 --ipv6; do
              curl "$family" -v -I --connect-timeout 8 --max-time 12 "$url" || true
            done
          done
          python3 - <<'PY'
          import socket, urllib.request
          print(socket.getaddrinfo('aerolytica.skyviewor.team', 443), flush=True)
          try:
              with urllib.request.urlopen('https://aerolytica.skyviewor.team/download/stable.json', timeout=12) as r:
                  print('Python HTTPS status:', r.status, flush=True)
          except Exception as e:
              print('Python HTTPS exception:', type(e).__name__, flush=True)
          PY
