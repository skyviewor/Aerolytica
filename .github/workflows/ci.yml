name: Client checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src tests scripts/release
      - name: Warm build dependencies for offline release tests
        run: uv build --out-dir "$RUNNER_TEMP/aero-build-check"
      - run: uv run --locked pytest
      - working-directory: webui
        run: npm ci && npm run check && npm run build
      - run: uv build --out-dir dist/pypi
      - run: uv run --locked python scripts/release/validate_artifacts.py dist/pypi
