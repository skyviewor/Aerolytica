[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerolytica"
version = "0.1.1"
description = "Aero — 气象科研 AI Agent IDE"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.9,<2",
    "xarray>=2024.1",
    "netcdf4>=1.7",
    "cdsapi>=0.7",
    "structlog>=24.1",
    "textual>=8.2,<9",
    "textual-image[textual]>=0.13.2,<0.14",
    "pdfplumber>=0.11",
    "cryptography>=42.0",
    "fastapi>=0.138,<1",
    "uvicorn>=0.49,<1",
    "sse-starlette>=3.4,<4",
    "python-multipart>=0.0.20,<1",
    "packaging>=24.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
    "ruff>=0.4",
]

[project.scripts]
aero = "aero.cli.entrypoint:main"

[project.urls]
Homepage = "https://aerolytica.skyviewor.team/"
Repository = "https://github.com/skyviewor/Aerolytica"

[tool.hatch.build.targets.wheel]
packages = ["src/aero"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/webui", "/scripts/release", "/tests", "/docs", "/install.sh", "/uv.lock", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
